# Dependabot configuration — review item 16.
#
# Enables automated dependency updates for:
#   - the main Next.js app (npm, repo root)
#   - the standalone email-server (npm, /email-server — it has its own
#     package.json and its dependency versions have drifted from the app)
#   - GitHub Actions used by the workflows in .github/workflows/
#
# Minor and patch updates are grouped into a single PR per ecosystem to
# limit PR noise. Major updates are intentionally left ungrouped so each
# one arrives as its own PR and can be reviewed / tested on its own
# (e.g. Next.js and ESLint majors).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/email-server"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
