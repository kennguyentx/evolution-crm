name: CI

# Runs lint, typecheck, tests and build on every push to main and every PR,
# so breakage is caught at PR time instead of at deploy time.
on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # No package-lock.json is committed, so use `npm install` (not `npm ci`).
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      # The build constructs Supabase clients at module scope, so it fails
      # with "supabaseUrl is required" unless the env vars merely EXIST.
      # These placeholders are never connected to — Vercel supplies the real
      # values when it builds for deployment.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy
          SUPABASE_SERVICE_ROLE_KEY: dummy
