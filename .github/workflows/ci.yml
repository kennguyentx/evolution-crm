name: CI

# Runs lint + typecheck on every push to main and every PR, so build/lint
# breakage is caught at PR time instead of at deploy time.
on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # No package-lock.json is committed, so use `npm install` (not `npm ci`).
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
