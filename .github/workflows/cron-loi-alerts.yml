name: Daily LOI alerts

# Every day at 14:00 UTC (10:00 ET).
on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: LOI alerts
        run: |
          SECRET=$(printf '%s' "$CRON_SECRET" | tr -d '[:space:]')
          code=$(curl -s -o /tmp/out.txt -w "%{http_code}" \
            -H "x-vercel-protection-bypass: $BYPASS" \
            -X GET "https://nexus.evolutionstrategy.com/api/deals/loi-alerts?cron_secret=$SECRET")
          echo "deals/loi-alerts -> HTTP $code"; cat /tmp/out.txt; echo
          test "$code" -ge 200 -a "$code" -lt 300
