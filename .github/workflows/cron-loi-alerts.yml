name: Daily LOI alerts

# MANUAL BACKUP ONLY — real scheduler is Vercel native crons (vercel.json).
on:
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: LOI alerts
        run: |
          SECRET=$(printf '%s' "$CRON_SECRET" | tr -d '[:space:]')
          code=$(curl -s -o /tmp/out.txt -w "%{http_code}" \
            "https://nexus.evolutionstrategy.com/api/deals/loi-alerts?cron_secret=$SECRET")
          echo "deals/loi-alerts -> HTTP $code"; cat /tmp/out.txt; echo
          test "$code" -ge 200 -a "$code" -lt 300
