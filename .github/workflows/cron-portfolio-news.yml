name: Daily portfolio news

# Every day at 17:00 UTC (13:00 ET / 12:00 CT).
on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Portfolio news daily email
        run: |
          code=$(curl -s -o /tmp/out.txt -w "%{http_code}" \
            -X GET "https://nexus.evolutionstrategy.com/api/portfolio-news/daily-email" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "portfolio-news/daily-email -> HTTP $code"; cat /tmp/out.txt; echo
          test "$code" -ge 200 -a "$code" -lt 300
