name: Weekly emails (digest + pipeline)

# MANUAL BACKUP ONLY. The real scheduler is Vercel native crons (vercel.json);
# GitHub's scheduled runs proved unreliable (top-of-hour runs get dropped), so the
# schedule trigger is disabled here to avoid double-sends. Use "Run workflow" to
# fire a send by hand if ever needed.
on:
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Pipeline weekly email
        run: |
          SECRET=$(printf '%s' "$CRON_SECRET" | tr -d '[:space:]')
          code=$(curl -s -o /tmp/out.txt -w "%{http_code}" \
            "https://nexus.evolutionstrategy.com/api/pipeline/weekly-email?cron_secret=$SECRET")
          echo "pipeline/weekly-email -> HTTP $code"; cat /tmp/out.txt; echo
          test "$code" -ge 200 -a "$code" -lt 300

      - name: Weekly digest
        run: |
          SECRET=$(printf '%s' "$CRON_SECRET" | tr -d '[:space:]')
          code=$(curl -s -o /tmp/out.txt -w "%{http_code}" \
            "https://nexus.evolutionstrategy.com/api/digest?cron_secret=$SECRET")
          echo "digest -> HTTP $code"; cat /tmp/out.txt; echo
          test "$code" -ge 200 -a "$code" -lt 300
